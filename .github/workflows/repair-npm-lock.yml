name: Repair npm lockfile (temporary)

on:
  push:
    branches:
      - feat/noel-2026-experience
    paths:
      - .github/workflows/repair-npm-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate from the committed manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'JS'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (l.lockfileVersion !== 3 || !l.packages?.['']) throw Error('Invalid regenerated lockfile');
          const root = l.packages[''];
          for (const category of ['dependencies', 'devDependencies']) {
            for (const [name, range] of Object.entries(m[category] ?? {})) {
              if (root[category]?.[name] !== range) throw Error('Lock mismatch: ' + name);
            }
          }
          console.log('Regenerated package-lock.json:', Object.keys(l.packages).length, 'package entries');
          JS
      - name: Commit repaired lockfile on refonte branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): regenerate corrupted npm lockfile"
          git push origin HEAD:feat/noel-2026-experience
