name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap status
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          echo "package-lock.json is not committed yet."
          echo "Skipping Node quality gates during repository bootstrap."
          echo "Run npm install locally, commit package-lock.json, then CI will enforce lint/typecheck/tests."
      - name: Validate committed lockfile
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3 || !lock.packages?.['']) throw Error('Invalid npm lockfile');
          for (const type of ['dependencies', 'devDependencies']) {
            for (const [name, version] of Object.entries(manifest[type] ?? {})) {
              if (lock.packages[''][type]?.[name] !== version) throw Error('Lockfile out of sync for ' + name);
            }
          }
          JS
      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - name: Lint
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run typecheck
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Typecheck deployed Edge Function
        run: deno check --config supabase/functions/deno.json supabase/functions/create-order-request/index.ts
      - name: Test
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm test -- --run
      - name: Verify shooting media integrity
        run: node scripts/check-shooting-media.mjs
      - name: Verify recovered migration history
        run: node scripts/check-migration-history.mjs
      - name: Rehearse the production migration bundle
        run: node scripts/rehearse-production-migration.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build with inert public configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-public-key
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Install browser for desktop and mobile smoke tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke with synthetic cart and payments disabled
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-public-key
          FEDAPAY_ENABLED: 'false'
          PAYMENT_CHECKOUT_ENABLED: 'false'
          ORDER_NOTIFICATIONS_ENABLED: 'false'
        run: npm run test:e2e

  commerce-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: mdp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mdp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture-only-password@localhost:5432/mdp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-commerce-postgres.mjs

  # Runs the real release scripts on PostgreSQL 17 against a stand-in production. No secret, no external service.
  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disposable PostgreSQL 17
        run: bash scripts/release/start-pg17.sh
      - name: Stand-in production database
        run: bash scripts/release/simulate-production.sh
      - name: Backup, strict restore, comparison, preflight, rehearsal
        run: |
          echo "PROD_DB_URL=${DRILL_ADMIN_URL%/*}/prodsim" >> "$GITHUB_ENV"
          BACKUP_MODE=v1-rehearsal PROD_DB_URL="${DRILL_ADMIN_URL%/*}/prodsim" RELEASE_SHA="$GITHUB_SHA" bash scripts/release/backup-drill.sh
      - name: A real pg_restore error stops the drill
        run: |
          # A public table that depends on a schema outside the restored set cannot be recreated on the copy.
          docker exec -e TARGET="$PROD_DB_URL" lmp-pg17 sh -c 'psql "$TARGET" -X -q -v ON_ERROR_STOP=1 -c "create schema sim_outside; create table sim_outside.parent(id int primary key); create table public.sim_child(id int references sim_outside.parent(id))"'
          if RELEASE_SHA="$GITHUB_SHA" EVIDENCE_DIR=evidence-negative bash scripts/release/backup-drill.sh > negative.log 2>&1; then echo "A failing restore was accepted"; exit 1; fi
          grep -q "pg_restore a rencontré une erreur" negative.log
          docker exec -e TARGET="$PROD_DB_URL" lmp-pg17 sh -c 'psql "$TARGET" -X -q -v ON_ERROR_STOP=1 -c "drop table public.sim_child; drop schema sim_outside cascade"'
          rm -rf evidence backups evidence-negative
          BACKUP_MODE=v1-rehearsal RELEASE_SHA="$GITHUB_SHA" bash scripts/release/backup-drill.sh > /dev/null
      - name: Encrypted backup round trip
        run: |
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 --output full.dump.gpg backups/full.dump 3<<<"fixture-passphrase-for-ci-only-0000"
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt --output readback.dump full.dump.gpg 3<<<"fixture-passphrase-for-ci-only-0000"
          cmp backups/full.dump readback.dump
      - name: Guarded migration, then refusal of a second run
        run: |
          DRILL_EVIDENCE_DIR=evidence RELEASE_SHA="$GITHUB_SHA" bash scripts/release/migrate.sh
          if DRILL_EVIDENCE_DIR=evidence RELEASE_SHA="$GITHUB_SHA" bash scripts/release/migrate.sh > second.log 2>&1; then echo "A second migration was accepted"; exit 1; fi
          grep -q "ARRÊT AVANT TOUTE ÉCRITURE" second.log
      - name: Current backup accepts the migrated source and cannot authorize V1
        run: |
          RELEASE_SHA="$GITHUB_SHA" EVIDENCE_DIR=evidence-current bash scripts/release/backup-drill.sh
          grep -qx 'backup_mode=current' evidence-current/PREUVE.txt
          if grep -q 'sha256_migration=' evidence-current/PREUVE.txt; then echo "Current backup contains a migration proof"; exit 1; fi
          if DRILL_EVIDENCE_DIR=evidence-current RELEASE_SHA="$GITHUB_SHA" bash scripts/release/migrate.sh > current-migration.log 2>&1; then echo "Current backup authorized migration"; exit 1; fi
          grep -q "un backup courant" current-migration.log
          if BACKUP_MODE=v1-rehearsal RELEASE_SHA="$GITHUB_SHA" EVIDENCE_DIR=evidence-v1-refused bash scripts/release/backup-drill.sh > migrated-v1.log 2>&1; then echo "V1 accepted an already migrated source"; exit 1; fi
          grep -q "préflight de production" migrated-v1.log
      - name: Evidence holds no personal data
        run: |
          if grep -rlE "example\.test|Cliente|2290100000000|not-a-real-hash" evidence evidence-current evidence-v1-refused evidence-migration; then echo "Personal data found in evidence"; exit 1; fi
          cat evidence/PREUVE.txt evidence-migration/PREUVE-MIGRATION.txt

