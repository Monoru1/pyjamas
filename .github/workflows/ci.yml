name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap status
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          echo "package-lock.json is not committed yet."
          echo "Skipping Node quality gates during repository bootstrap."
          echo "Run npm install locally, commit package-lock.json, then CI will enforce lint/typecheck/tests."
      - name: Validate committed lockfile
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3 || !lock.packages?.['']) throw Error('Invalid npm lockfile');
          for (const type of ['dependencies', 'devDependencies']) {
            for (const [name, version] of Object.entries(manifest[type] ?? {})) {
              if (lock.packages[''][type]?.[name] !== version) throw Error('Lockfile out of sync for ' + name);
            }
          }
          JS
      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - name: Lint
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run typecheck
      - name: Test
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm test -- --run --passWithNoTests
